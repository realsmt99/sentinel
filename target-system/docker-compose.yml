# Acme Coffee Roasters - the "company" system Sentinel plugs into.
#
# Sentinel touch points:
#   - sentinel.* container labels (read by the Sentinel scanner)
#   - one include line in nginx/default.conf (../sentinel/nginx/killswitch.conf)
#   - ../runtime/flags/<service>.flag on the host = take that service offline
#
# Always pass SHOP_IMAGE explicitly when recreating shop: without it the default
# (sentinel-shop:vulnerable) is used.
#   SHOP_IMAGE=sentinel-shop:patched docker compose -f target-system/docker-compose.yml up -d --no-build shop

name: sentinel-target

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: edge-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../sentinel/nginx:/etc/nginx/sentinel:ro
      - ../runtime/flags:/var/run/sentinel:ro
    networks:
      - public
    restart: unless-stopped

  shop:
    build: ./shop
    image: ${SHOP_IMAGE:-sentinel-shop:vulnerable}
    container_name: shop
    networks:
      - public
      - internal
    labels:
      sentinel.service: "shop"
      sentinel.language: "php"
      sentinel.runtime_mode: "apache2handler"
      sentinel.exposure: "public"
      sentinel.revenue: "40000"
      sentinel.repo_path: "target-system/shop/Dockerfile"
    restart: unless-stopped

  admin-panel:
    build: ./admin-panel
    image: ${ADMIN_PANEL_IMAGE:-sentinel-admin-panel:vulnerable}
    container_name: admin-panel
    networks:
      - internal
    labels:
      sentinel.service: "admin-panel"
      sentinel.language: "php"
      sentinel.runtime_mode: "fpm-fcgi"
      sentinel.exposure: "internal"
      sentinel.revenue: "0"
      sentinel.repo_path: "target-system/admin-panel/Dockerfile"
    restart: unless-stopped

  billing-worker:
    image: python:3.12-slim
    container_name: billing-worker
    command: ["sleep", "infinity"]
    init: true
    networks:
      - internal
    labels:
      sentinel.service: "billing-worker"
      sentinel.language: "python"
      sentinel.exposure: "internal"
      sentinel.revenue: "15000"
    restart: unless-stopped

networks:
  public:
    name: sentinel_public
  internal:
    name: sentinel_internal
    internal: true
