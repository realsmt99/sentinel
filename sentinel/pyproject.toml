[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel: CVE feed triage and a multi-agent incident response team (OpenAI Agents SDK + Aiven Postgres)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai-agents>=0.4",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyGithub>=2.3",
    "packaging>=24.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
sentinel = "sentinel.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
