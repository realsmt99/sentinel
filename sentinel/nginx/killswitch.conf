# Sentinel kill switch. Set the service name before including this file:
#
#   set $sentinel_service shop;
#   include /etc/nginx/sentinel/killswitch.conf;
#
# Sentinel creates runtime/flags/<service>.flag on the host (mounted at
# /var/run/sentinel) to take the service offline; deleting it brings it back.

# Check the flag with open() instead of stat(): Colima's sshfs share caches
# stat results for ~20 s, which would keep a deleted flag "present". With an
# open_file_cache whose min_uses is never reached, nginx keeps no descriptor and
# re-opens the flag on every request; a missing flag is never cached.
open_file_cache max=64 inactive=10s;
open_file_cache_min_uses 1000000000;
open_file_cache_errors off;

if (-f /var/run/sentinel/$sentinel_service.flag) {
    return 503;
}
